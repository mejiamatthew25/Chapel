<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer Sign-Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#232A3D;
    --ink-soft:#5B6272;
    --paper:#F0EEE4;
    --white:#FFFFFF;
    --line:#D9D2C2;
    --gold:#B8862E;
    --gold-soft:#EFE1BE;
    --slate:#4C6B8A;
    --sage:#5B7A5B;
    --danger:#A24C42;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  header.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    margin-bottom:24px;
  }
  .titleblock h1{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:30px;
    line-height:1.15;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .titleblock p{
    margin:0;
    color:var(--ink-soft);
    font-size:14.5px;
  }
  .nav-side{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:4px;
  }
  .nav-side .whoami{
    font-size:13px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .nav-links{ display:flex; gap:10px; }
  .navlink{
    background:none;
    border:none;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
    padding:6px 0;
    text-decoration:underline;
    text-decoration-color:var(--line);
    text-underline-offset:3px;
    white-space:nowrap;
  }
  .navlink:hover{ color:var(--ink); text-decoration-color:var(--ink-soft); }

  .error-banner{
    background:#F7E8E4;
    border:1px solid var(--danger);
    color:#7A362E;
    border-radius:6px;
    padding:12px 14px;
    font-size:13.5px;
    margin-bottom:16px;
    line-height:1.5;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
  }
  .error-banner button{
    background:none; border:none; color:#7A362E; cursor:pointer; font-size:13px;
    text-decoration:underline; flex:none;
  }

  /* ---- calendar ---- */
  .cal-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .cal-nav .month-label{
    font-family:'Source Serif 4', serif;
    font-size:18px;
    font-weight:600;
  }
  .cal-nav-btns{ display:flex; gap:6px; }
  .cal-nav-btns button{
    background:var(--white);
    border:1px solid var(--line);
    width:30px; height:30px;
    border-radius:5px;
    cursor:pointer;
    font-size:15px;
    color:var(--ink);
    line-height:1;
  }
  .cal-nav-btns button:hover{ border-color:var(--ink-soft); }

  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:3px;
    margin-bottom:4px;
  }
  .cal-dow{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    padding-bottom:6px;
  }
  .cal-cell{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:6px;
    min-height:52px;
    padding:5px 5px 6px;
    cursor:pointer;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:4px;
    font-family:'Inter',sans-serif;
  }
  .cal-cell.empty{
    background:transparent;
    border-color:transparent;
    cursor:default;
  }
  .cal-cell .num{
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .cal-cell.today .num{
    color:var(--white);
    background:var(--ink);
    width:19px;height:19px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .cal-cell.selected{
    border-color:var(--ink);
    box-shadow:inset 0 0 0 1px var(--ink);
  }
  .cal-cell.has-slots:hover{ border-color:var(--ink-soft); }
  .cal-dots{ display:flex; gap:3px; flex-wrap:wrap; }
  .cal-dots span{ width:6px;height:6px;border-radius:50%; }
  .cal-dots .more{ font-size:9.5px; color:var(--ink-soft); }

  @media (max-width:420px){
    .cal-cell{ min-height:42px; padding:4px; }
    .cal-dow{ font-size:9.5px; }
  }

  /* ---- day panel ---- */
  .day-panel{ margin-top:22px; }
  .day-panel-heading{
    font-family:'Source Serif 4', serif;
    font-size:19px;
    font-weight:600;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
    margin-bottom:4px;
  }
  .past-note{
    color:var(--ink-soft);
    font-size:13px;
    padding:10px 0;
  }

  .slot-row{
    padding:14px 0 16px;
    border-bottom:1px dashed var(--line);
  }
  .slot-row:last-child{ border-bottom:none; }
  .slot-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .role-tag{
    display:flex;
    align-items:center;
    gap:7px;
    font-weight:600;
    font-size:15px;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    flex:none;
  }
  .slot-time{
    color:var(--ink-soft);
    font-size:13.5px;
  }
  .fill-status{
    font-size:13px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .fill-status.full{ color:var(--sage); font-weight:600; }
  .fill-status.mine{ color:var(--slate); font-weight:600; }

  .capacity-dots{ display:flex; gap:4px; margin-top:6px; }
  .capacity-dots span{
    width:7px;height:7px;border-radius:50%;
    background:var(--line);
  }
  .capacity-dots span.on{ background:var(--gold); }

  .names{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:100px;
    padding:4px 11px;
    font-size:13px;
  }
  .chip.mine{ background:var(--white); border-color:var(--slate); padding-right:6px; }
  .chip button{
    background:none;
    border:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:13px;
    line-height:1;
    padding:2px 4px;
    border-radius:50%;
  }
  .chip button:hover{ color:var(--danger); }
  .chip.confirming{ background:var(--white); border-color:var(--danger); }
  .confirm-inline{
    display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft);
  }
  .confirm-inline button{
    border:none; background:none; cursor:pointer; font-weight:600; font-size:12.5px; padding:0;
  }
  .confirm-inline .yes{ color:var(--danger); }
  .confirm-inline .no{ color:var(--ink-soft); text-decoration:underline; }

  .signup-btn{
    margin-top:10px;
    background:var(--ink);
    color:var(--white);
    border:none;
    padding:8px 16px;
    border-radius:5px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .signup-btn:hover{ background:#3a4358; }
  .signup-btn:disabled{ background:var(--line); color:var(--ink-soft); cursor:default; }

  .inline-form{
    margin-top:10px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  input[type=text], input[type=number], input[type=time], input[type=password], input[type=email], select{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:8px 10px;
    border-radius:5px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink);
  }
  input[type=text]:focus, input[type=number]:focus, input[type=time]:focus, input[type=password]:focus, input[type=email]:focus, select:focus{
    outline:2px solid var(--slate);
    outline-offset:1px;
  }
  .inline-form input[type=text]{ flex:1; min-width:140px; }

  .btn{
    background:var(--ink);
    color:var(--white);
    border:none;
    padding:8px 14px;
    border-radius:5px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .btn:hover{ background:#3a4358; }
  .btn.secondary{
    background:none;
    color:var(--ink);
    border:1px solid var(--line);
  }
  .btn.secondary:hover{ border-color:var(--ink-soft); }
  .btn.danger{ background:var(--danger); }
  .btn.danger:hover{ background:#8a3d35; }
  .btn:disabled{ background:var(--line); color:var(--ink-soft); cursor:default; }

  .empty{
    padding:40px 10px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14.5px;
    border-top:1px solid var(--line);
    margin-top:20px;
  }

  /* ---- admin ---- */
  .admin-section{ margin-bottom:36px; }
  .admin-section h2{
    font-family:'Source Serif 4', serif;
    font-size:20px;
    font-weight:600;
    margin:0 0 4px;
  }
  .admin-section .sub{
    color:var(--ink-soft);
    font-size:13.5px;
    margin:0 0 14px;
  }
  .form-error{
    color:var(--danger);
    font-size:13px;
    margin:2px 0 10px;
  }
  .field-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:10px;
  }
  .field-row label{
    font-size:13px;
    color:var(--ink-soft);
    display:block;
    margin-bottom:4px;
  }
  .field{ display:flex; flex-direction:column; }

  .role-list, .slot-list, .user-list{ margin-top:14px; }
  .role-item, .slot-item, .user-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
    gap:10px;
    flex-wrap:wrap;
  }
  .role-item .left, .slot-item .left, .user-item .left{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .user-item .left{ flex-direction:column; align-items:flex-start; gap:1px; }
  .user-item .uname{ color:var(--ink-soft); font-size:12.5px; }
  .row-actions{ display:flex; gap:12px; align-items:center; }
  .swatch{
    width:14px;height:14px;border-radius:50%;flex:none;
  }
  .color-picker{ display:flex; gap:6px; }
  .color-picker button{
    width:22px;height:22px;border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
  }
  .color-picker button.selected{ border-color:var(--ink); }

  .credential-banner{
    background:var(--gold-soft);
    border:1px solid var(--gold);
    border-radius:6px;
    padding:12px 14px;
    font-size:13.5px;
    margin-bottom:16px;
    line-height:1.6;
  }
  .credential-banner strong{ font-weight:700; }
  .credential-banner .dismiss{ margin-top:8px; }

  .auth-box{
    max-width:340px;
    margin:50px auto;
    text-align:center;
  }
  .auth-box h2{
    font-family:'Source Serif 4', serif;
    font-size:22px;
    margin-bottom:4px;
  }
  .auth-box p{ color:var(--ink-soft); font-size:14px; margin-bottom:18px;}
  .auth-box .field{ text-align:left; }
  .auth-box input.wide{ width:100%; text-align:left; letter-spacing:normal; }
  .auth-error{ color:var(--danger); font-size:13px; margin-top:8px; min-height:18px; }
  .auth-success{ color:var(--sage); font-size:13px; margin-top:8px; }

  .loading{ text-align:center; padding:60px 0; color:var(--ink-soft); font-size:14px; }
  .small-link{
    background:none; border:none; color:var(--ink-soft); text-decoration:underline;
    cursor:pointer; font-size:12.5px; padding:0; font-family:'Inter',sans-serif;
  }
  .checkbox-row{
    display:flex; align-items:center; gap:6px; margin:2px 0 10px;
  }
  .checkbox-row input{ width:auto; }
  .checkbox-row label{ font-size:13px; color:var(--ink-soft); cursor:pointer; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Loading…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// =====================================================================
// Fill these in from Supabase → Project Settings → API before deploying.
// =====================================================================
const SUPABASE_URL = 'https://owyvjdvapgjycwmktmcq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_hGU88JRIZTxoELSqWiTmDw_rYyPY5CC';

const sb = SUPABASE_URL.startsWith('http')
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

const PALETTE = ['#B8862E','#4C6B8A','#5B7A5B','#A24C42','#7A5B9C','#3D7A78'];
const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW_SHORT = ['S','M','T','W','T','F','S'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const today = new Date(); today.setHours(0,0,0,0);

let state = {
  loaded:false,
  view:'login', // login | register | forgot | reset | signup | changepass | admin
  session:null,
  profile:null,          // {id, name, is_admin} for the signed-in user
  profiles:[],           // all profiles, for name lookups + admin roster
  churchName:'Our Church',
  roles:[],
  slots:[],
  signups:[],            // [{id, slot_id, user_id, signup_date}]

  calendarMonth:new Date(today.getFullYear(), today.getMonth(), 1),
  selectedDate:new Date(today),
  confirmTarget:null,
  slotActionError:'',
  errorBanner:null,

  loginEmail:'', loginPassword:'', loginError:'',
  regName:'', regEmail:'', regPassword:'', regError:'', regNotice:'',
  forgotEmail:'', forgotError:'', forgotSuccess:'',
  resetPassword:'', resetError:'', resetSuccess:'',
  cpNew:'', cpConfirm:'', cpError:'', cpSuccess:'',

  newRoleName:'', newRoleColor:PALETTE[0], roleFormError:'',
  newSlot:{roleId:'', day:'0', start:'09:00', end:'10:00', capacity:3}, slotFormError:'',
  newChurchName:'', churchNameError:'',
  userFormError:''
};

function uid(){ return Math.random().toString(36).slice(2,10); } // for DOM-only helper ids, not DB rows

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/'/g,'&#39;'); }

function fmtTime(t){
  const [h,m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  let h12 = h % 12; if(h12===0) h12=12;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}
function isoDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function sameDate(a,b){ return isoDate(a)===isoDate(b); }
function fmtDateLong(d){ return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' }); }

function roleById(id){ return state.roles.find(r=>r.id===id); }
function profileById(id){ return state.profiles.find(p=>p.id===id); }
function profileName(id){ const p = profileById(id); return p ? p.name : '(former volunteer)'; }

function slotsForDate(d){
  const dow = d.getDay();
  return state.slots
    .filter(s=>Number(s.day)===dow)
    .map(slot=>({ slot, role:roleById(slot.role_id) }))
    .filter(x=>!!x.role)
    .sort((a,b)=>a.slot.start_time.localeCompare(b.slot.start_time));
}
function signupsFor(slotId, iso){
  return state.signups.filter(s=>s.slot_id===slotId && s.signup_date===iso);
}

function showError(err, fallback){
  state.errorBanner = (err && err.message) ? err.message : (fallback || 'Something went wrong.');
}

// ---------- AUTH BOOTSTRAP ----------

async function init(){
  if(!sb){
    state.loaded = true;
    state.errorBanner = "This app isn't connected to a database yet — a developer needs to add the Supabase URL and key near the top of the file.";
    render();
    return;
  }

  sb.auth.onAuthStateChange((event, session) => {
    state.session = session;
    if(event === 'PASSWORD_RECOVERY'){
      state.view = 'reset';
      render();
      return;
    }
    if(event === 'SIGNED_OUT'){
      state.profile = null;
      state.view = 'login';
      render();
      return;
    }
    if(session && (state.view==='login' || state.view==='register')){
      loadForSession();
    }
  });

  const { data:{ session } } = await sb.auth.getSession();
  state.session = session;
  if(session){
    await loadForSession();
  } else {
    state.loaded = true;
    render();
  }
}

async function loadForSession(){
  await fetchAll();
  state.loaded = true;
  if(state.view==='login' || state.view==='register') state.view = 'signup';
  render();
}

async function fetchAll(){
  if(!state.session) return;
  try{
    const [rolesRes, slotsRes, signupsRes, settingsRes, profilesRes, myProfileRes] = await Promise.all([
      sb.from('roles').select('*').order('name'),
      sb.from('slots').select('*'),
      sb.from('signups').select('id, slot_id, user_id, signup_date'),
      sb.from('church_settings').select('church_name').maybeSingle(),
      sb.from('profiles').select('id, name, is_admin').order('name'),
      sb.from('profiles').select('id, name, is_admin').eq('id', state.session.user.id).maybeSingle()
    ]);
    for(const r of [rolesRes, slotsRes, signupsRes, settingsRes, profilesRes, myProfileRes]){
      if(r.error) throw r.error;
    }
    state.roles = rolesRes.data || [];
    state.slots = slotsRes.data || [];
    state.signups = signupsRes.data || [];
    state.churchName = (settingsRes.data && settingsRes.data.church_name) || 'Our Church';
    state.profiles = profilesRes.data || [];
    state.profile = myProfileRes.data || null;

    // Self-heal: a signed-in user with no matching `profiles` row (e.g. an
    // account created before the signup trigger existed) would otherwise
    // hang forever on "Loading your profile…". Create the missing row here.
    if(!state.profile){
      const isFirst = state.profiles.length === 0;
      const fallbackName = (state.session.user.user_metadata && state.session.user.user_metadata.name)
        || (state.session.user.email ? state.session.user.email.split('@')[0] : 'Volunteer');
      const { data: created, error: createErr } = await sb.from('profiles')
        .insert({ id: state.session.user.id, name: fallbackName, is_admin: isFirst })
        .select('id, name, is_admin')
        .single();
      if(createErr) throw createErr;
      state.profile = created;
      state.profiles.push(created);
      state.profiles.sort((a,b)=>a.name.localeCompare(b.name));
    }

    state.errorBanner = null;
  }catch(e){
    showError(e, 'Could not load the schedule from the database.');
  }
}

// ---------- AUTH ACTIONS ----------

async function login(){
  state.loginError = '';
  const email = state.loginEmail.trim();
  const password = state.loginPassword;
  if(!email || !password){ state.loginError = 'Enter your email and password.'; render(); return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ state.loginError = error.message; render(); return; }
  state.session = data.session;
  state.loginEmail=''; state.loginPassword='';
  await loadForSession();
}

async function registerAccount(){
  state.regError = ''; state.regNotice = '';
  const name = state.regName.trim();
  const email = state.regEmail.trim();
  const password = state.regPassword;
  if(!name){ state.regError = 'Enter your name.'; render(); return; }
  if(!email){ state.regError = 'Enter your email.'; render(); return; }
  if(!password || password.length < 6){ state.regError = 'Password must be at least 6 characters.'; render(); return; }
  const { data, error } = await sb.auth.signUp({
    email, password,
    options:{ data:{ name } }
  });
  if(error){ state.regError = error.message; render(); return; }
  state.regName=''; state.regEmail=''; state.regPassword='';
  if(data.session){
    state.session = data.session;
    await loadForSession();
  } else {
    state.regNotice = 'Account created! Check your email to confirm it, then sign in.';
    state.view = 'login';
    render();
  }
}

async function logout(){
  await sb.auth.signOut();
  state.session = null;
  state.profile = null;
  state.view = 'login';
  render();
}

async function sendResetEmail(){
  state.forgotError=''; state.forgotSuccess='';
  const email = state.forgotEmail.trim();
  if(!email){ state.forgotError = 'Enter your email.'; render(); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });
  if(error){ state.forgotError = error.message; render(); return; }
  state.forgotSuccess = 'Check your email for a password reset link.';
  render();
}

async function submitNewPassword(){
  state.resetError='';
  const password = state.resetPassword;
  if(!password || password.length < 6){ state.resetError = 'Password must be at least 6 characters.'; render(); return; }
  const { error } = await sb.auth.updateUser({ password });
  if(error){ state.resetError = error.message; render(); return; }
  state.resetSuccess = 'Password updated — taking you to the schedule…';
  state.resetPassword = '';
  render();
  setTimeout(async ()=>{ state.view='signup'; await loadForSession(); }, 1200);
}

async function changePassword(){
  state.cpError=''; state.cpSuccess='';
  if(!state.cpNew || state.cpNew.length < 6){ state.cpError = 'New password must be at least 6 characters.'; render(); return; }
  if(state.cpNew !== state.cpConfirm){ state.cpError = 'Passwords do not match.'; render(); return; }
  const { error } = await sb.auth.updateUser({ password: state.cpNew });
  if(error){ state.cpError = error.message; render(); return; }
  state.cpSuccess = 'Password changed.';
  state.cpNew=''; state.cpConfirm='';
  render();
}

// ---------- CALENDAR / SIGN-UPS ----------

function changeMonth(delta){
  const d = state.calendarMonth;
  state.calendarMonth = new Date(d.getFullYear(), d.getMonth()+delta, 1);
  render();
}
function selectDate(y,m,day){
  state.selectedDate = new Date(y,m,day);
  state.confirmTarget = null;
  state.slotActionError = '';
  render();
}

async function submitSignup(slotId, iso, capacity){
  state.slotActionError = '';
  const myId = state.session.user.id;
  if(state.signups.some(s=>s.slot_id===slotId && s.signup_date===iso && s.user_id===myId)) return;
  if(signupsFor(slotId, iso).length >= capacity) return; // fast client-side check; the database is the real guard
  const { data, error } = await sb.from('signups')
    .insert({ slot_id: slotId, user_id: myId, signup_date: iso })
    .select('id, slot_id, user_id, signup_date')
    .single();
  if(error){ state.slotActionError = error.message; render(); return; }
  state.signups.push(data);
  render();
}
function askRemoveSignup(target){ state.confirmTarget = target; render(); }
async function removeSignup(id){
  const { error } = await sb.from('signups').delete().eq('id', id);
  if(error){ state.slotActionError = error.message; render(); return; }
  state.signups = state.signups.filter(s=>s.id!==id);
  state.confirmTarget = null;
  render();
}

function renderCalendar(){
  const cm = state.calendarMonth;
  const firstDow = new Date(cm.getFullYear(), cm.getMonth(), 1).getDay();
  const numDays = new Date(cm.getFullYear(), cm.getMonth()+1, 0).getDate();

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell empty"></div>`;

  for(let day=1; day<=numDays; day++){
    const d = new Date(cm.getFullYear(), cm.getMonth(), day);
    const daySlots = slotsForDate(d);
    const isToday = sameDate(d, today);
    const isSelected = sameDate(d, state.selectedDate);
    const uniqueRoles = [...new Map(daySlots.map(x=>[x.role.id,x.role])).values()];
    const shown = uniqueRoles.slice(0,4);
    const extra = uniqueRoles.length - shown.length;
    const dots = shown.map(r=>`<span style="background:${r.color}"></span>`).join('') + (extra>0?`<span class="more">+${extra}</span>`:'');

    cells += `
      <button type="button" class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''} ${daySlots.length?'has-slots':''}"
        onclick="selectDate(${cm.getFullYear()},${cm.getMonth()},${day})">
        <span class="num">${day}</span>
        <span class="cal-dots">${dots}</span>
      </button>`;
  }

  const dow = DOW_SHORT.map(s=>`<div class="cal-dow">${s}</div>`).join('');

  return `
    <div class="cal-nav">
      <div class="month-label">${MONTH_NAMES[cm.getMonth()]} ${cm.getFullYear()}</div>
      <div class="cal-nav-btns">
        <button onclick="changeMonth(-1)" aria-label="Previous month">‹</button>
        <button onclick="changeMonth(1)" aria-label="Next month">›</button>
      </div>
    </div>
    <div class="cal-grid">${dow}${cells}</div>
  `;
}

function renderDayPanel(){
  const d = state.selectedDate;
  const daySlots = slotsForDate(d);
  const isPast = d < today;
  const myId = state.session.user.id;

  let inner = '';
  if(state.slotActionError){
    inner += `<div class="form-error">${escapeHtml(state.slotActionError)}</div>`;
  }
  if(daySlots.length === 0){
    inner += `<p class="past-note">Nothing scheduled this day.</p>`;
  } else {
    if(isPast) inner += `<p class="past-note">This date has passed.</p>`;
    inner += daySlots.map(({slot, role})=>{
      const iso = isoDate(d);
      const filled = signupsFor(slot.id, iso);
      const cap = slot.capacity;
      const isFull = filled.length >= cap;
      const mine = filled.find(e=>e.user_id===myId);
      const capDots = Array.from({length:cap}).map((_,i)=>`<span class="${i<filled.length?'on':''}"></span>`).join('');

      const namesHtml = filled.length ? `<div class="names">${filled.map(e=>{
        const isMine = e.user_id===myId;
        const name = profileName(e.user_id);
        if(!isMine) return `<span class="chip">${escapeHtml(name)}</span>`;
        const ctarget = `signup:${e.id}`;
        if(state.confirmTarget===ctarget){
          return `<span class="chip confirming">${escapeHtml(name)}
            <span class="confirm-inline">Cancel?
              <button class="yes" onclick="removeSignup('${e.id}')">Yes</button>
              <button class="no" onclick="state.confirmTarget=null; render()">No</button>
            </span>
          </span>`;
        }
        return `<span class="chip mine">${escapeHtml(name)}<button title="Cancel" onclick="askRemoveSignup('${ctarget}')">×</button></span>`;
      }).join('')}</div>` : '';

      let actionHtml = '';
      if(!isPast){
        if(mine){
          actionHtml = `<div style="margin-top:8px" class="fill-status mine">You're signed up for this.</div>`;
        } else {
          actionHtml = `<button class="signup-btn" ${isFull?'disabled':''} onclick="submitSignup('${slot.id}','${iso}',${cap})">${isFull?'Full':'Sign up'}</button>`;
        }
      }

      return `
        <div class="slot-row">
          <div class="slot-top">
            <div class="role-tag"><span class="dot" style="background:${role.color}"></span>${escapeHtml(role.name)}</div>
            <div class="fill-status ${isFull?'full':''}">${isFull ? 'Filled' : `${filled.length} of ${cap} filled`}</div>
          </div>
          <div class="slot-time">${fmtTime(slot.start_time)} – ${fmtTime(slot.end_time)}</div>
          <div class="capacity-dots">${capDots}</div>
          ${namesHtml}
          ${actionHtml}
        </div>`;
    }).join('');
  }

  return `
    <div class="day-panel">
      <div class="day-panel-heading">${fmtDateLong(d)}</div>
      ${inner}
    </div>
  `;
}

function renderSignupView(){
  if(state.roles.length===0 || state.slots.length===0){
    return `
      <div class="empty">
        No volunteer slots have been set up yet.${state.profile && state.profile.is_admin ? ' Head to Admin to add roles and time slots.' : ' Ask your administrator to add roles and time slots.'}
      </div>`;
  }
  return renderCalendar() + renderDayPanel();
}

// ---------- ADMIN ----------

async function saveChurchName(){
  state.churchNameError = '';
  const val = state.newChurchName.trim();
  if(!val) return;
  const { error } = await sb.from('church_settings').update({ church_name: val }).eq('id', true);
  if(error){ state.churchNameError = error.message; render(); return; }
  state.churchName = val;
  state.newChurchName = '';
  render();
}

async function addRole(){
  state.roleFormError = '';
  const name = state.newRoleName.trim();
  if(!name){ state.roleFormError = 'Enter a role name.'; render(); return; }
  const { data, error } = await sb.from('roles').insert({ name, color: state.newRoleColor }).select().single();
  if(error){ state.roleFormError = error.message; render(); return; }
  state.roles.push(data);
  state.roles.sort((a,b)=>a.name.localeCompare(b.name));
  state.newRoleName = '';
  render();
}
async function deleteRole(id){
  const { error } = await sb.from('roles').delete().eq('id', id);
  if(error){ showError(error, 'Could not delete that role.'); state.confirmTarget=null; render(); return; }
  state.roles = state.roles.filter(r=>r.id!==id);
  const removedSlotIds = state.slots.filter(s=>s.role_id===id).map(s=>s.id);
  state.slots = state.slots.filter(s=>s.role_id!==id);
  state.signups = state.signups.filter(s=>!removedSlotIds.includes(s.slot_id));
  state.confirmTarget = null;
  render();
}

async function addSlot(){
  state.slotFormError = '';
  const { roleId, day, start, end, capacity } = state.newSlot;
  if(!roleId){ state.slotFormError = 'Choose a role first.'; render(); return; }
  if(!start || !end){ state.slotFormError = 'Set a start and end time.'; render(); return; }
  if(start >= end){ state.slotFormError = 'End time must be after start time.'; render(); return; }
  if(!capacity || Number(capacity) < 1){ state.slotFormError = 'Volunteers needed must be at least 1.'; render(); return; }
  const { data, error } = await sb.from('slots').insert({
    role_id: roleId, day:Number(day), start_time:start, end_time:end, capacity:Number(capacity)
  }).select().single();
  if(error){ state.slotFormError = error.message; render(); return; }
  state.slots.push(data);
  render();
}
async function deleteSlot(id){
  const { error } = await sb.from('slots').delete().eq('id', id);
  if(error){ showError(error, 'Could not delete that slot.'); state.confirmTarget=null; render(); return; }
  state.slots = state.slots.filter(s=>s.id!==id);
  state.signups = state.signups.filter(s=>s.slot_id!==id);
  state.confirmTarget = null;
  render();
}

async function toggleAdmin(id, current){
  state.userFormError = '';
  const { error } = await sb.from('profiles').update({ is_admin: !current }).eq('id', id);
  if(error){ state.userFormError = error.message; render(); return; }
  const p = profileById(id);
  if(p) p.is_admin = !current;
  if(state.profile && state.profile.id===id) state.profile.is_admin = !current;
  render();
}

function exportRosterCSV(){
  function csvField(s){
    s = String(s === undefined || s === null ? '' : s);
    if(/[",\r\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  }
  const rows = [['Name','Admin']];
  for(const p of state.profiles) rows.push([p.name, p.is_admin ? 'Yes' : '']);
  const csv = rows.map(r=>r.map(csvField).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `volunteer-roster-${isoDate(new Date())}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

// ---------- SHELL / ROUTING ----------

function goAdmin(){
  if(!state.profile || !state.profile.is_admin) return;
  state.view = 'admin';
  state.confirmTarget = null;
  render();
}
function goSignup(){
  state.view = state.session ? 'signup' : 'login';
  state.confirmTarget = null;
  render();
}

function render(){
  const app = document.getElementById('app');
  if(!state.loaded){
    app.innerHTML = `<div class="loading">Loading…</div>`;
    return;
  }

  if((state.view==='signup' || state.view==='changepass') && !state.session){
    state.view = 'login';
  }
  if(state.view==='admin' && (!state.profile || !state.profile.is_admin)){
    state.view = state.session ? 'signup' : 'login';
  }

  const bareViews = ['login','register','forgot','reset','changepass'];
  const isBare = bareViews.includes(state.view);

  let navHtml = '';
  if(!isBare && state.session && state.profile){
    if(state.view==='admin'){
      navHtml = `
        <div class="nav-side">
          <span class="whoami">Signed in as ${escapeHtml(state.profile.name)}</span>
          <div class="nav-links">
            <button class="navlink" onclick="goSignup()">View sign-up sheet</button>
            <button class="navlink" onclick="state.view='changepass'; state.cpError=''; state.cpSuccess=''; render()">Change password</button>
            <button class="navlink" onclick="logout()">Sign out</button>
          </div>
        </div>`;
    } else {
      navHtml = `
        <div class="nav-side">
          <span class="whoami">Signed in as ${escapeHtml(state.profile.name)}</span>
          <div class="nav-links">
            ${state.profile.is_admin ? `<button class="navlink" onclick="goAdmin()">Admin</button>` : ''}
            <button class="navlink" onclick="state.view='changepass'; state.cpError=''; state.cpSuccess=''; render()">Change password</button>
            <button class="navlink" onclick="logout()">Sign out</button>
          </div>
        </div>`;
    }
  }

  const heading = state.view==='admin'
    ? `<div class="titleblock"><h1>Admin</h1><p>Manage roles, slots, and volunteers</p></div>`
    : `<div class="titleblock"><h1>${escapeHtml(state.churchName)}</h1><p>Volunteer sign-up</p></div>`;

  const errorHtml = state.errorBanner
    ? `<div class="error-banner"><span>${escapeHtml(state.errorBanner)}</span><button onclick="state.errorBanner=null; render()">Dismiss</button></div>`
    : '';

  let body = '';
  if(state.view==='admin') body = renderAdmin();
  else if(state.view==='login') body = renderLogin();
  else if(state.view==='register') body = renderRegister();
  else if(state.view==='forgot') body = renderForgot();
  else if(state.view==='reset') body = renderReset();
  else if(state.view==='changepass') body = renderChangePass();
  else if(state.session && state.profile) body = renderSignupView();
  else body = state.errorBanner ? '' : `<div class="loading">Loading your profile…</div>`;

  app.innerHTML = `
    <header class="top">
      ${heading}
      ${navHtml}
    </header>
    ${errorHtml}
    ${body}
  `;
}

init();
</script>
</body>
</html>
