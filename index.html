<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer Sign-Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16311F;
    --ink-soft:#5B6B5D;
    --paper:#FFFFFF;
    --white:#FFFFFF;
    --line:#DCD5C0;
    --gold:#1B4D2E;
    --gold-soft:#E1EBDE;
    --slate:#2F6B45;
    --sage:#3C7A52;
    --danger:#A24C42;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:960px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  header.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    margin-bottom:24px;
  }
  .titleblock h1{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:30px;
    line-height:1.15;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .titleblock p{
    margin:0;
    color:var(--ink-soft);
    font-size:14.5px;
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .brand-logo{
    width:52px;
    height:52px;
    object-fit:contain;
    flex:none;
  }
  .nav-side{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:4px;
  }
  .nav-side .whoami{
    font-size:13px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .tabbar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:10px 16px;
    padding-bottom:14px;
    margin-bottom:24px;
    border-bottom:1px solid var(--line);
  }
  .tabbar .whoami{
    font-size:13px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .tabs{ display:flex; flex-wrap:wrap; gap:6px; }
  .tab{
    background:none;
    border:1px solid transparent;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    padding:8px 14px;
    border-radius:100px;
    white-space:nowrap;
  }
  .tab:hover{ color:var(--ink); border-color:var(--line); }
  .tab.active{
    background:var(--gold-soft);
    color:var(--ink);
  }
  .tab.signout{ color:var(--danger); }
  .tab.signout:hover{ color:#7A362E; border-color:#F0D8D4; }
  .navlink{
    background:none;
    border:none;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
    padding:6px 0;
    text-decoration:underline;
    text-decoration-color:var(--line);
    text-underline-offset:3px;
    white-space:nowrap;
  }
  .navlink:hover{ color:var(--ink); text-decoration-color:var(--ink-soft); }

  .error-banner{
    background:#F7E8E4;
    border:1px solid var(--danger);
    color:#7A362E;
    border-radius:6px;
    padding:12px 14px;
    font-size:13.5px;
    margin-bottom:16px;
    line-height:1.5;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
  }
  .error-banner button{
    background:none; border:none; color:#7A362E; cursor:pointer; font-size:13px;
    text-decoration:underline; flex:none;
  }

  /* ---- calendar ---- */
  .cal-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .cal-nav .month-label{
    font-family:'Source Serif 4', serif;
    font-size:18px;
    font-weight:600;
  }
  .cal-nav-btns{ display:flex; gap:6px; }
  .cal-nav-btns button{
    background:var(--white);
    border:1px solid var(--line);
    width:30px; height:30px;
    border-radius:5px;
    cursor:pointer;
    font-size:15px;
    color:var(--ink);
    line-height:1;
  }
  .cal-nav-btns button:hover{ border-color:var(--ink-soft); }

  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:3px;
    margin-bottom:4px;
  }
  .cal-dow{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    padding-bottom:6px;
  }
  .cal-cell{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:6px;
    min-height:52px;
    padding:5px 5px 6px;
    cursor:pointer;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:4px;
    font-family:'Inter',sans-serif;
  }
  .cal-cell.empty{
    background:transparent;
    border-color:transparent;
    cursor:default;
  }
  .cal-cell .num{
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .cal-cell.today .num{
    color:var(--white);
    background:var(--ink);
    width:19px;height:19px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .cal-cell.selected{
    border-color:var(--ink);
    box-shadow:inset 0 0 0 1px var(--ink);
  }
  .cal-cell.has-slots:hover{ border-color:var(--ink-soft); }
  .cal-cell.past{
    background:var(--gold-soft);
    opacity:0.6;
    cursor:not-allowed;
    pointer-events:none;
  }
  .cal-dots{ display:flex; gap:3px; flex-wrap:wrap; }
  .cal-dots span{ width:6px;height:6px;border-radius:50%; position:relative; }
  .cal-dots span.full::after{
    content:'';
    position:absolute;
    top:50%; left:-1.5px; right:-1.5px;
    height:1.5px;
    background:var(--ink);
    transform:translateY(-50%) rotate(-45deg);
  }
  .cal-dots .more{ font-size:9.5px; color:var(--ink-soft); }
  .export-row{ margin-top:14px; }

  @media (max-width:420px){
    .cal-cell{ min-height:42px; padding:4px; }
    .cal-dow{ font-size:9.5px; }
  }

  /* ---- day panel ---- */
  .day-panel{ margin-top:22px; }
  .day-panel-heading{
    font-family:'Source Serif 4', serif;
    font-size:19px;
    font-weight:600;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
    margin-bottom:4px;
  }
  .past-note{
    color:var(--ink-soft);
    font-size:13px;
    padding:10px 0;
    overflow-wrap:break-word;
    word-break:break-word;
  }

  .slot-row{
    padding:14px 0 16px;
    border-bottom:1px dashed var(--line);
  }
  .slot-row:last-child{ border-bottom:none; }
  .slot-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .role-tag{
    display:flex;
    align-items:center;
    gap:7px;
    font-weight:600;
    font-size:15px;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    flex:none;
  }
  .slot-time{
    color:var(--ink-soft);
    font-size:13.5px;
  }
  .fill-status{
    font-size:13px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .fill-status.full{ color:var(--sage); font-weight:600; }
  .fill-status.mine{
    color:var(--ink);
    font-weight:600;
    display:inline-block;
    background:var(--gold-soft);
    padding:4px 10px;
    border-radius:100px;
  }

  .cal-export{ margin-top:6px; }
  .cal-export-menu{
    margin-top:6px;
    display:flex;
    flex-direction:column;
    gap:2px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--white);
    padding:6px;
    max-width:220px;
  }
  .cal-export-menu a, .cal-export-menu button{
    display:block;
    text-align:left;
    background:none;
    border:none;
    color:var(--ink);
    text-decoration:none;
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:7px 8px;
    border-radius:4px;
    cursor:pointer;
  }
  .cal-export-menu a:hover, .cal-export-menu button:hover{ background:var(--gold-soft); }

  .capacity-dots{ display:flex; gap:4px; margin-top:6px; }
  .capacity-dots span{
    width:7px;height:7px;border-radius:50%;
    background:var(--line);
  }
  .capacity-dots span.on{ background:var(--gold); }

  .names{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
  }
  .note-list{
    margin-top:8px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .note-line{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.4;
    background:var(--gold-soft);
    border-radius:6px;
    padding:6px 10px;
  }
  .note-line strong{ color:var(--ink); font-weight:600; }
  .chip{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--gold-soft);
    border:1px solid var(--line);
    border-radius:100px;
    padding:4px 11px;
    font-size:13px;
  }
  .chip.mine{ background:var(--white); border-color:var(--slate); padding-right:6px; }
  .chip.admin-removable{ background:var(--white); border-color:var(--ink-soft); padding-right:6px; }
  .admin-assign{
    display:flex;
    gap:8px;
    align-items:center;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .admin-assign select{
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:7px 8px;
    border-radius:5px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink);
  }
  .chip button{
    background:none;
    border:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:13px;
    line-height:1;
    padding:2px 4px;
    border-radius:50%;
  }
  .chip button:hover{ color:var(--danger); }
  .chip.confirming{ background:var(--white); border-color:var(--danger); }
  .confirm-inline{
    display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft);
  }
  .confirm-inline button{
    border:none; background:none; cursor:pointer; font-weight:600; font-size:12.5px; padding:0;
  }
  .confirm-inline .yes{ color:var(--danger); }
  .confirm-inline .no{ color:var(--ink-soft); text-decoration:underline; }

  .signup-btn{
    margin-top:10px;
    background:var(--ink);
    color:var(--white);
    border:none;
    padding:8px 16px;
    border-radius:5px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .signup-btn:hover{ background:#0F3620; }
  .signup-btn:disabled{ background:var(--line); color:var(--ink-soft); cursor:default; }

  .inline-form{
    margin-top:10px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  input[type=text], input[type=number], input[type=time], input[type=password], input[type=email], input[type=date], select, textarea{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:8px 10px;
    border-radius:5px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink);
  }
  textarea{ width:100%; resize:vertical; }
  input[type=text]:focus, input[type=number]:focus, input[type=time]:focus, input[type=password]:focus, input[type=email]:focus, input[type=date]:focus, select:focus, textarea:focus{
    outline:2px solid var(--slate);
    outline-offset:1px;
  }
  .inline-form input[type=text]{ flex:1; min-width:140px; }

  .btn{
    background:var(--ink);
    color:var(--white);
    border:none;
    padding:8px 14px;
    border-radius:5px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .btn:hover{ background:#0F3620; }
  .btn.secondary{
    background:none;
    color:var(--ink);
    border:1px solid var(--line);
  }
  .btn.secondary:hover{ border-color:var(--ink-soft); }
  .btn.danger{ background:var(--danger); }
  .btn.danger:hover{ background:#8a3d35; }
  .btn:disabled{ background:var(--line); color:var(--ink-soft); cursor:default; }

  .empty{
    padding:40px 10px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14.5px;
    border-top:1px solid var(--line);
    margin-top:20px;
  }

  /* ---- two-column layout (schedule + announcements) ---- */
  .page-grid{
    display:grid;
    grid-template-columns:1fr 300px;
    gap:32px;
    align-items:start;
  }
  .main-col{ min-width:0; }
  .side-col{ min-width:0; }
  @media (max-width:800px){
    .page-grid{ grid-template-columns:1fr; }
  }

  .sidebar-card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:8px;
    padding:18px;
  }
  .sidebar-title{
    font-family:'Source Serif 4', serif;
    font-size:18px;
    font-weight:600;
    margin:0 0 14px;
  }
  .announcement-card{
    padding:14px 0;
    border-top:1px solid var(--line);
  }
  .announcement-card:first-of-type{ border-top:none; padding-top:0; }
  .announcement-title{
    font-weight:700;
    font-size:14.5px;
    margin-bottom:4px;
  }
  .announcement-body{
    font-size:13.5px;
    color:var(--ink);
    white-space:pre-wrap;
    line-height:1.5;
    margin-bottom:6px;
  }
  .announcement-meta{
    font-size:12px;
    color:var(--ink-soft);
  }
  .announcement-actions{
    display:flex;
    gap:12px;
    margin-top:8px;
  }
  .announcement-form{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:14px;
  }
  .announcement-form input, .announcement-form textarea{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    padding:8px 10px;
    border-radius:5px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink);
    resize:vertical;
  }
  .announcement-form textarea:focus, .announcement-form input:focus{
    outline:2px solid var(--slate);
    outline-offset:1px;
  }

  /* ---- admin ---- */
  .admin-section{ margin-bottom:36px; }
  .admin-section h2{
    font-family:'Source Serif 4', serif;
    font-size:20px;
    font-weight:600;
    margin:0 0 4px;
  }
  .admin-section .sub{
    color:var(--ink-soft);
    font-size:13.5px;
    margin:0 0 14px;
  }
  .form-error{
    color:var(--danger);
    font-size:13px;
    margin:2px 0 10px;
  }
  .field-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:10px;
  }
  .field-row label{
    font-size:13px;
    color:var(--ink-soft);
    display:block;
    margin-bottom:4px;
  }
  .field{ display:flex; flex-direction:column; }

  .role-list, .slot-list, .user-list{ margin-top:14px; }
  .role-item, .slot-item, .user-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
    gap:10px;
    flex-wrap:wrap;
  }
  .role-item .left, .slot-item .left, .user-item .left{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .user-item .left{ flex-direction:column; align-items:flex-start; gap:1px; }
  .user-item .uname{ color:var(--ink-soft); font-size:12.5px; }
  .slot-desc{
    color:var(--ink-soft);
    font-size:12.5px;
    margin-top:3px;
    line-height:1.4;
  }
  .row-actions{ display:flex; gap:12px; align-items:center; }
  .swatch{
    width:14px;height:14px;border-radius:50%;flex:none;
  }
  .color-picker{ display:flex; gap:6px; }
  .color-picker button{
    width:22px;height:22px;border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
  }
  .color-picker button.selected{ border-color:var(--ink); }

  .credential-banner{
    background:var(--gold-soft);
    border:1px solid var(--gold);
    border-radius:6px;
    padding:12px 14px;
    font-size:13.5px;
    margin-bottom:16px;
    line-height:1.6;
  }
  .credential-banner strong{ font-weight:700; }
  .credential-banner .dismiss{ margin-top:8px; }

  .auth-box{
    max-width:340px;
    margin:50px auto;
    text-align:center;
  }
  .auth-box h2{
    font-family:'Source Serif 4', serif;
    font-size:22px;
    margin-bottom:4px;
  }
  .auth-box p{ color:var(--ink-soft); font-size:14px; margin-bottom:18px;}
  .auth-box .field{ text-align:left; }
  .auth-box input.wide{ width:100%; text-align:left; letter-spacing:normal; }
  .auth-error{ color:var(--danger); font-size:13px; margin-top:8px; min-height:18px; }
  .auth-success{ color:var(--sage); font-size:13px; margin-top:8px; }

  .loading{ text-align:center; padding:60px 0; color:var(--ink-soft); font-size:14px; }
  .small-link{
    background:none; border:none; color:var(--ink-soft); text-decoration:underline;
    cursor:pointer; font-size:12.5px; padding:0; font-family:'Inter',sans-serif;
  }
  .checkbox-row{
    display:flex; align-items:center; gap:6px; margin:2px 0 10px;
  }
  .checkbox-row input{ width:auto; }
  .checkbox-row label{ font-size:13px; color:var(--ink-soft); cursor:pointer; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Loading…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
// =====================================================================
// Fill these in from Supabase → Project Settings → API before deploying.
// =====================================================================
const SUPABASE_URL = 'https://owyvjdvapgjycwmktmcq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_hGU88JRIZTxoELSqWiTmDw_rYyPY5CC';

const sb = SUPABASE_URL.startsWith('http')
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
