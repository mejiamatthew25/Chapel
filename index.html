<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer Sign-Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16311F;
    --ink-soft:#5B6B5D;
    --paper:#FFFFFF;
    --white:#FFFFFF;
    --line:#DCD5C0;
    --gold:#1B4D2E;
    --gold-soft:#E1EBDE;
    --slate:#2F6B45;
    --sage:#3C7A52;
    --danger:#A24C42;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:960px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  header.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    margin-bottom:24px;
  }
  .titleblock h1{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:30px;
    line-height:1.15;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .titleblock p{
    margin:0;
    color:var(--ink-soft);
    font-size:14.5px;
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .brand-logo{
    width:52px;
    height:52px;
    object-fit:contain;
    flex:none;
  }
  .nav-side{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:4px;
  }
  .nav-side .whoami{
    font-size:13px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .tabbar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:10px 16px;
    padding-bottom:14px;
    margin-bottom:24px;
    border-bottom:1px solid var(--line);
  }
  .tabbar .whoami{
    font-size:13px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .tabs{ display:flex; flex-wrap:wrap; gap:6px; }
  .tab{
    background:none;
    border:1px solid transparent;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    padding:8px 14px;
    border-radius:100px;
    white-space:nowrap;
  }
  .tab:hover{ color:var(--ink); border-color:var(--line); }
  .tab.active{
    background:var(--gold-soft);
    color:var(--ink);
  }
  .tab.signout{ color:var(--danger); }
  .tab.signout:hover{ color:#7A362E; border-color:#F0D8D4; }
  .navlink{
    background:none;
    border:none;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
    padding:6px 0;
    text-decoration:underline;
    text-decoration-color:var(--line);
    text-underline-offset:3px;
    white-space:nowrap;
  }
  .navlink:hover{ color:var(--ink); text-decoration-color:var(--ink-soft); }

  .error-banner{
    background:#F7E8E4;
    border:1px solid var(--danger);
    color:#7A362E;
    border-radius:6px;
    padding:12px 14px;
    font-size:13.5px;
    margin-bottom:16px;
    line-height:1.5;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
  }
  .error-banner button{
    background:none; border:none; color:#7A362E; cursor:pointer; font-size:13px;
    text-decoration:underline; flex:none;
  }

  /* ---- calendar ---- */
  .cal-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .cal-nav .month-label{
    font-family:'Source Serif 4', serif;
    font-size:18px;
    font-weight:600;
  }
  .cal-nav-btns{ display:flex; gap:6px; }
  .cal-nav-btns button{
    background:var(--white);
    border:1px solid var(--line);
    width:30px; height:30px;
    border-radius:5px;
    cursor:pointer;
    font-size:15px;
    color:var(--ink);
    line-height:1;
  }
  .cal-nav-btns button:hover{ border-color:var(--ink-soft); }

  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:3px;
    margin-bottom:4px;
  }
  .cal-dow{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    padding-bottom:6px;
  }
  .cal-cell{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:6px;
    min-height:52px;
    padding:5px 5px 6px;
    cursor:pointer;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:4px;
    font-family:'Inter',sans-serif;
  }
  .cal-cell.empty{
    background:transparent;
    border-color:transparent;
    cursor:default;
  }
  .cal-cell .num{
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .cal-cell.today .num{
    color:var(--white);
    background:var(--ink);
    width:19px;height:19px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .cal-cell.selected{
    border-color:var(--ink);
    box-shadow:inset 0 0 0 1px var(--ink);
  }
  .cal-cell.has-slots:hover{ border-color:var(--ink-soft); }
  .cal-cell.past{
    background:var(--gold-soft);
    opacity:0.6;
    cursor:not-allowed;
    pointer-events:none;
  }
  .cal-dots{ display:flex; gap:3px; flex-wrap:wrap; }
  .cal-dots span{ width:6px;height:6px;border-radius:50%; position:relative; }
  .cal-dots span.full::after{
    content:'';
    position:absolute;
    top:50%; left:-1.5px; right:-1.5px;
    height:1.5px;
    background:var(--ink);
    transform:translateY(-50%) rotate(-45deg);
  }
  .cal-dots .more{ font-size:9.5px; color:var(--ink-soft); }

  @media (max-width:420px){
    .cal-cell{ min-height:42px; padding:4px; }
    .cal-dow{ font-size:9.5px; }
  }

  /* ---- day panel ---- */
  .day-panel{ margin-top:22px; }
  .day-panel-heading{
    font-family:'Source Serif 4', serif;
    font-size:19px;
    font-weight:600;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
    margin-bottom:4px;
  }
  .past-note{
    color:var(--ink-soft);
    font-size:13px;
    padding:10px 0;
  }

  .slot-row{
    padding:14px 0 16px;
    border-bottom:1px dashed var(--line);
  }
  .slot-row:last-child{ border-bottom:none; }
  .slot-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .role-tag{
    display:flex;
    align-items:center;
    gap:7px;
    font-weight:600;
    font-size:15px;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    flex:none;
  }
  .slot-time{
    color:var(--ink-soft);
    font-size:13.5px;
  }
  .fill-status{
    font-size:13px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .fill-status.full{ color:var(--sage); font-weight:600; }
  .fill-status.mine{
    color:var(--ink);
    font-weight:600;
    display:inline-block;
    background:var(--gold-soft);
    padding:4px 10px;
    border-radius:100px;
  }

  .cal-export{ margin-top:6px; }
  .cal-export-menu{
    margin-top:6px;
    display:flex;
    flex-direction:column;
    gap:2px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--white);
    padding:6px;
    max-width:220px;
  }
  .cal-export-menu a, .cal-export-menu button{
    display:block;
    text-align:left;
    background:none;
    border:none;
    color:var(--ink);
    text-decoration:none;
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:7px 8px;
    border-radius:4px;
    cursor:pointer;
  }
  .cal-export-menu a:hover, .cal-export-menu button:hover{ background:var(--gold-soft); }

  .capacity-dots{ display:flex; gap:4px; margin-top:6px; }
  .capacity-dots span{
    width:7px;height:7px;border-radius:50%;
    background:var(--line);
  }
  .capacity-dots span.on{ background:var(--gold); }

  .names{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
  }
  .note-list{
    margin-top:8px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .note-line{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.4;
    background:var(--gold-soft);
    border-radius:6px;
    padding:6px 10px;
  }
  .note-line strong{ color:var(--ink); font-weight:600; }
  .chip{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--gold-soft);
    border:1px solid var(--line);
    border-radius:100px;
    padding:4px 11px;
    font-size:13px;
  }
  .chip.mine{ background:var(--white); border-color:var(--slate); padding-right:6px; }
  .chip button{
    background:none;
    border:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:13px;
    line-height:1;
    padding:2px 4px;
    border-radius:50%;
  }
  .chip button:hover{ color:var(--danger); }
  .chip.confirming{ background:var(--white); border-color:var(--danger); }
  .confirm-inline{
    display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft);
  }
  .confirm-inline button{
    border:none; background:none; cursor:pointer; font-weight:600; font-size:12.5px; padding:0;
  }
  .confirm-inline .yes{ color:var(--danger); }
  .confirm-inline .no{ color:var(--ink-soft); text-decoration:underline; }

  .signup-btn{
    margin-top:10px;
    background:var(--ink);
    color:var(--white);
    border:none;
    padding:8px 16px;
    border-radius:5px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .signup-btn:hover{ background:#0F3620; }
  .signup-btn:disabled{ background:var(--line); color:var(--ink-soft); cursor:default; }

  .inline-form{
    margin-top:10px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  input[type=text], input[type=number], input[type=time], input[type=password], input[type=email], select{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:8px 10px;
    border-radius:5px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink);
  }
  input[type=text]:focus, input[type=number]:focus, input[type=time]:focus, input[type=password]:focus, input[type=email]:focus, select:focus{
    outline:2px solid var(--slate);
    outline-offset:1px;
  }
  .inline-form input[type=text]{ flex:1; min-width:140px; }

  .btn{
    background:var(--ink);
    color:var(--white);
    border:none;
    padding:8px 14px;
    border-radius:5px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .btn:hover{ background:#0F3620; }
  .btn.secondary{
    background:none;
    color:var(--ink);
    border:1px solid var(--line);
  }
  .btn.secondary:hover{ border-color:var(--ink-soft); }
  .btn.danger{ background:var(--danger); }
  .btn.danger:hover{ background:#8a3d35; }
  .btn:disabled{ background:var(--line); color:var(--ink-soft); cursor:default; }

  .empty{
    padding:40px 10px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14.5px;
    border-top:1px solid var(--line);
    margin-top:20px;
  }

  /* ---- two-column layout (schedule + announcements) ---- */
  .page-grid{
    display:grid;
    grid-template-columns:1fr 300px;
    gap:32px;
    align-items:start;
  }
  .main-col{ min-width:0; }
  .side-col{ min-width:0; }
  @media (max-width:800px){
    .page-grid{ grid-template-columns:1fr; }
  }

  .sidebar-card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:8px;
    padding:18px;
  }
  .sidebar-title{
    font-family:'Source Serif 4', serif;
    font-size:18px;
    font-weight:600;
    margin:0 0 14px;
  }
  .announcement-card{
    padding:14px 0;
    border-top:1px solid var(--line);
  }
  .announcement-card:first-of-type{ border-top:none; padding-top:0; }
  .announcement-title{
    font-weight:700;
    font-size:14.5px;
    margin-bottom:4px;
  }
  .announcement-body{
    font-size:13.5px;
    color:var(--ink);
    white-space:pre-wrap;
    line-height:1.5;
    margin-bottom:6px;
  }
  .announcement-meta{
    font-size:12px;
    color:var(--ink-soft);
  }
  .announcement-actions{
    display:flex;
    gap:12px;
    margin-top:8px;
  }
  .announcement-form{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:14px;
  }
  .announcement-form input, .announcement-form textarea{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    padding:8px 10px;
    border-radius:5px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink);
    resize:vertical;
  }
  .announcement-form textarea:focus, .announcement-form input:focus{
    outline:2px solid var(--slate);
    outline-offset:1px;
  }

  /* ---- admin ---- */
  .admin-section{ margin-bottom:36px; }
  .admin-section h2{
    font-family:'Source Serif 4', serif;
    font-size:20px;
    font-weight:600;
    margin:0 0 4px;
  }
  .admin-section .sub{
    color:var(--ink-soft);
    font-size:13.5px;
    margin:0 0 14px;
  }
  .form-error{
    color:var(--danger);
    font-size:13px;
    margin:2px 0 10px;
  }
  .field-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:10px;
  }
  .field-row label{
    font-size:13px;
    color:var(--ink-soft);
    display:block;
    margin-bottom:4px;
  }
  .field{ display:flex; flex-direction:column; }

  .role-list, .slot-list, .user-list{ margin-top:14px; }
  .role-item, .slot-item, .user-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
    gap:10px;
    flex-wrap:wrap;
  }
  .role-item .left, .slot-item .left, .user-item .left{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .user-item .left{ flex-direction:column; align-items:flex-start; gap:1px; }
  .user-item .uname{ color:var(--ink-soft); font-size:12.5px; }
  .row-actions{ display:flex; gap:12px; align-items:center; }
  .swatch{
    width:14px;height:14px;border-radius:50%;flex:none;
  }
  .color-picker{ display:flex; gap:6px; }
  .color-picker button{
    width:22px;height:22px;border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
  }
  .color-picker button.selected{ border-color:var(--ink); }

  .credential-banner{
    background:var(--gold-soft);
    border:1px solid var(--gold);
    border-radius:6px;
    padding:12px 14px;
    font-size:13.5px;
    margin-bottom:16px;
    line-height:1.6;
  }
  .credential-banner strong{ font-weight:700; }
  .credential-banner .dismiss{ margin-top:8px; }

  .auth-box{
    max-width:340px;
    margin:50px auto;
    text-align:center;
  }
  .auth-box h2{
    font-family:'Source Serif 4', serif;
    font-size:22px;
    margin-bottom:4px;
  }
  .auth-box p{ color:var(--ink-soft); font-size:14px; margin-bottom:18px;}
  .auth-box .field{ text-align:left; }
  .auth-box input.wide{ width:100%; text-align:left; letter-spacing:normal; }
  .auth-error{ color:var(--danger); font-size:13px; margin-top:8px; min-height:18px; }
  .auth-success{ color:var(--sage); font-size:13px; margin-top:8px; }

  .loading{ text-align:center; padding:60px 0; color:var(--ink-soft); font-size:14px; }
  .small-link{
    background:none; border:none; color:var(--ink-soft); text-decoration:underline;
    cursor:pointer; font-size:12.5px; padding:0; font-family:'Inter',sans-serif;
  }
  .checkbox-row{
    display:flex; align-items:center; gap:6px; margin:2px 0 10px;
  }
  .checkbox-row input{ width:auto; }
  .checkbox-row label{ font-size:13px; color:var(--ink-soft); cursor:pointer; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Loading…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

function uid(){ return Math.random().toString(36).slice(2,10); } // for DOM-only helper ids, not DB rows

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/'/g,'&#39;'); }

function fmtTime(t){
  const [h,m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  let h12 = h % 12; if(h12===0) h12=12;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}
function isoDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function sameDate(a,b){ return isoDate(a)===isoDate(b); }
function fmtDateLong(d){ return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' }); }
function fmtDateWithYear(d){ return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' }); }

function roleById(id){ return state.roles.find(r=>r.id===id); }
function profileById(id){ return state.profiles.find(p=>p.id===id); }
function profileName(id){ const p = profileById(id); return p ? p.name : '(former volunteer)'; }

function slotsForDate(d){
  const dow = d.getDay();
  const iso = isoDate(d);
  return state.slots
    .filter(s => s.specific_date ? s.specific_date === iso : Number(s.day) === dow)
    .map(slot=>({ slot, role:roleById(slot.role_id) }))
    .filter(x=>!!x.role)
    .sort((a,b)=>a.slot.start_time.localeCompare(b.slot.start_time));
}
function signupsFor(slotId, iso){
  return state.signups.filter(s=>s.slot_id===slotId && s.signup_date===iso);
}

function showError(err, fallback){
  state.errorBanner = (err && err.message) ? err.message : (fallback || 'Something went wrong.');
}

// ---------- AUTH BOOTSTRAP ----------

async function init(){
  if(!sb){
    state.loaded = true;
    state.errorBanner = "This app isn't connected to a database yet — a developer needs to add the Supabase URL and key near the top of the file.";
    render();
    return;
  }

  sb.auth.onAuthStateChange((event, session) => {
    state.session = session;
    if(event === 'PASSWORD_RECOVERY'){
      state.view = 'reset';
      render();
      return;
    }
    if(event === 'SIGNED_OUT'){
      state.profile = null;
      state.view = 'login';
      render();
      return;
    }
    if(session && (state.view==='login' || state.view==='register')){
      loadForSession();
    }
  });

  // Fetch the church name for the signed-out login/register screens too.
  // This is safe to attempt before auth as long as `church_settings` has a
  // public-read policy (see the SQL note); if it doesn't yet, this just
  // fails quietly and the "Our Church" fallback is used instead.
  await fetchChurchNamePublic();

  const { data:{ session } } = await sb.auth.getSession();
  state.session = session;
  if(session){
    await loadForSession();
  } else {
    state.loaded = true;
    render();
  }
}

async function fetchChurchNamePublic(){
  try{
    const { data, error } = await sb.from('church_settings').select('church_name').maybeSingle();
    if(error) throw error;
    if(data && data.church_name) state.churchName = data.church_name;
  }catch(e){
    // Graceful fallback: keep whatever state.churchName already is
    // (the "Our Church" default) if this table isn't publicly readable yet.
  }
}

async function loadForSession(){
  await fetchAll();
  state.loaded = true;
  if(state.view==='login' || state.view==='register') state.view = 'signup';
  render();
}

async function fetchAll(){
  if(!state.session) return;
  try{
    const [rolesRes, slotsRes, signupsRes, settingsRes, profilesRes, myProfileRes, announcementsRes] = await Promise.all([
      sb.from('roles').select('*').order('name'),
      sb.from('slots').select('*'),
      sb.from('signups').select('id, slot_id, user_id, signup_date, note'),
      sb.from('church_settings').select('church_name').maybeSingle(),
      sb.from('profiles').select('id, name, is_admin').order('name'),
      sb.from('profiles').select('id, name, is_admin').eq('id', state.session.user.id).maybeSingle(),
      sb.from('announcements').select('id, title, body, author_id, created_at').order('created_at', { ascending:false })
    ]);
    for(const r of [rolesRes, slotsRes, signupsRes, settingsRes, profilesRes, myProfileRes, announcementsRes]){
      if(r.error) throw r.error;
    }
    state.roles = rolesRes.data || [];
    state.slots = slotsRes.data || [];
    state.signups = signupsRes.data || [];
    state.churchName = (settingsRes.data && settingsRes.data.church_name) || 'Our Church';
    state.profiles = profilesRes.data || [];
    state.profile = myProfileRes.data || null;
    state.announcements = announcementsRes.data || [];

    // Self-heal: a signed-in user with no matching `profiles` row (e.g. an
    // account created before the signup trigger existed) would otherwise
    // hang forever on "Loading your profile…". Create the missing row here.
    if(!state.profile){
      const isFirst = state.profiles.length === 0;
      const fallbackName = (state.session.user.user_metadata && state.session.user.user_metadata.name)
        || (state.session.user.email ? state.session.user.email.split('@')[0] : 'Volunteer');
      const { data: created, error: createErr } = await sb.from('profiles')
        .insert({ id: state.session.user.id, name: fallbackName, is_admin: isFirst })
        .select('id, name, is_admin')
        .single();
      if(createErr) throw createErr;
      state.profile = created;
      state.profiles.push(created);
      state.profiles.sort((a,b)=>a.name.localeCompare(b.name));
    }

    state.errorBanner = null;
  }catch(e){
    showError(e, 'Could not load the schedule from the database.');
  }
}

// ---------- AUTH ACTIONS ----------

async function login(){
  state.loginError = '';
  const email = state.loginEmail.trim();
  const password = state.loginPassword;
  if(!email || !password){ state.loginError = 'Enter your email and password.'; render(); return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ state.loginError = error.message; render(); return; }
  state.session = data.session;
  state.loginEmail=''; state.loginPassword='';
  await loadForSession();
}

async function registerAccount(){
  state.regError = ''; state.regNotice = '';
  const name = state.regName.trim();
  const email = state.regEmail.trim();
  const password = state.regPassword;
  if(!name){ state.regError = 'Enter your name.'; render(); return; }
  if(!email){ state.regError = 'Enter your email.'; render(); return; }
  if(!password || password.length < 6){ state.regError = 'Password must be at least 6 characters.'; render(); return; }
  const { data, error } = await sb.auth.signUp({
    email, password,
    options:{ data:{ name } }
  });
  if(error){ state.regError = error.message; render(); return; }
  state.regName=''; state.regEmail=''; state.regPassword='';
  if(data.session){
    state.session = data.session;
    await loadForSession();
  } else {
    state.regNotice = 'Account created! Check your email to confirm it, then sign in.';
    state.view = 'login';
    render();
  }
}

async function logout(){
  await sb.auth.signOut();
  state.session = null;
  state.profile = null;
  state.view = 'login';
  render();
}

async function sendResetEmail(){
  state.forgotError=''; state.forgotSuccess='';
  const email = state.forgotEmail.trim();
  if(!email){ state.forgotError = 'Enter your email.'; render(); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });
  if(error){ state.forgotError = error.message; render(); return; }
  state.forgotSuccess = 'Check your email for a password reset link.';
  render();
}

async function submitNewPassword(){
  state.resetError='';
  const password = state.resetPassword;
  if(!password || password.length < 6){ state.resetError = 'Password must be at least 6 characters.'; render(); return; }
  const { error } = await sb.auth.updateUser({ password });
  if(error){ state.resetError = error.message; render(); return; }
  state.resetSuccess = 'Password updated — taking you to the schedule…';
  state.resetPassword = '';
  render();
  setTimeout(async ()=>{ state.view='signup'; await loadForSession(); }, 1200);
}

async function changePassword(){
  state.cpError=''; state.cpSuccess='';
  if(!state.cpNew || state.cpNew.length < 6){ state.cpError = 'New password must be at least 6 characters.'; render(); return; }
  if(state.cpNew !== state.cpConfirm){ state.cpError = 'Passwords do not match.'; render(); return; }
  const { error } = await sb.auth.updateUser({ password: state.cpNew });
  if(error){ state.cpError = error.message; render(); return; }
  state.cpSuccess = 'Password changed.';
  state.cpNew=''; state.cpConfirm='';
  render();
}

async function submitSignup(slotId, iso, capacity){

// ---------- CALENDAR EXPORT (Google Calendar / iCal) ----------

function toggleCalendarMenu(key){
  state.calendarMenuFor = (state.calendarMenuFor === key) ? null : key;
  render();
}

function gcalDateStr(dateObj, timeStr){
  const [h,m] = timeStr.split(':').map(Number);
  const y = dateObj.getFullYear(), mo = String(dateObj.getMonth()+1).padStart(2,'0'), da = String(dateObj.getDate()).padStart(2,'0');
  return `${y}${mo}${da}T${String(h).padStart(2,'0')}${String(m).padStart(2,'0')}00`;
}
function buildGoogleCalendarUrl(role, slot, dateObj, note){
  const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone) || 'UTC';
  const start = gcalDateStr(dateObj, slot.start_time);
  const end = gcalDateStr(dateObj, slot.end_time);
  const title = `${role.name} — ${state.churchName}`;
  let details = `Volunteering as ${role.name} for ${state.churchName}.`;
  if(note) details += `\n\nNote: ${note}`;
  const params = new URLSearchParams({
    action:'TEMPLATE',
    text:title,
    dates:`${start}/${end}`,
    details,
    location:state.churchName,
    ctz:tz
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

function icsDateStr(dateObj, timeStr){
  const [h,m] = timeStr.split(':').map(Number);
  const dt = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate(), h, m, 0);
  return dt.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
}
function escapeICS(s){
  return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function downloadICS(role, slot, dateObj, note){
  const iso = isoDate(dateObj);
  const dtStart = icsDateStr(dateObj, slot.start_time);
  const dtEnd = icsDateStr(dateObj, slot.end_time);
  const dtStamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const summary = escapeICS(`${role.name} — ${state.churchName}`);
  let descriptionText = `Volunteering as ${role.name} for ${state.churchName}.`;
  if(note) descriptionText += `\n\nNote: ${note}`;
  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Volunteer Sign-Up//EN',
    'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${slot.id}-${iso}@volunteer-signup`,
    `DTSTAMP:${dtStamp}`,
    `DTSTART:${dtStart}`,
    `DTEND:${dtEnd}`,
    `SUMMARY:${summary}`,
    `DESCRIPTION:${escapeICS(descriptionText)}`,
    `LOCATION:${escapeICS(state.churchName)}`,
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics], { type:'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${role.name.replace(/[^a-z0-9]+/gi,'-')}-${iso}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function parseIsoLocal(iso){
  const [y,m,dd] = iso.split('-').map(Number);
  return new Date(y, m-1, dd);
}
function triggerICSDownload(slotId, iso){
  const slot = state.slots.find(s=>s.id===slotId);
  if(!slot) return;
  const role = roleById(slot.role_id);
  if(!role) return;
  const mySignup = state.signups.find(s=>s.slot_id===slotId && s.signup_date===iso && s.user_id===state.session.user.id);
  downloadICS(role, slot, parseIsoLocal(iso), mySignup ? mySignup.note : '');
}

function renderCalendar(){
  const cm = state.calendarMonth;
  const firstDow = new Date(cm.getFullYear(), cm.getMonth(), 1).getDay();
  const numDays = new Date(cm.getFullYear(), cm.getMonth()+1, 0).getDate();

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell empty"></div>`;

  for(let day=1; day<=numDays; day++){
    const d = new Date(cm.getFullYear(), cm.getMonth(), day);
    const iso = isoDate(d);
    const daySlots = slotsForDate(d);
    const isToday = sameDate(d, today);
    const isSelected = sameDate(d, state.selectedDate);
    const isPast = d < today;
    const uniqueRoles = [...new Map(daySlots.map(x=>[x.role.id,x.role])).values()];
    const shown = uniqueRoles.slice(0,4);
    const extra = uniqueRoles.length - shown.length;
    const dots = shown.map(r=>{
      // A role is "full" for the day once every one of its slot instances that day has hit capacity.
      const roleSlots = daySlots.filter(x=>x.role.id===r.id);
      const isFull = roleSlots.every(x=>signupsFor(x.slot.id, iso).length >= x.slot.capacity);
      return `<span class="${isFull?'full':''}" style="background:${r.color}" title="${escapeAttr(r.name)}${isFull?' — full':''}"></span>`;
    }).join('') + (extra>0?`<span class="more">+${extra}</span>`:'');

    cells += `
      <button type="button" class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''} ${daySlots.length?'has-slots':''} ${isPast?'past':''}"
        onclick="selectDate(${cm.getFullYear()},${cm.getMonth()},${day})" ${isPast?'disabled':''}>
        <span class="num">${day}</span>
        <span class="cal-dots">${dots}</span>
      </button>`;
  }

  const dow = DOW_SHORT.map(s=>`<div class="cal-dow">${s}</div>`).join('');

  return `
    <div class="cal-nav">
      <div class="month-label">${MONTH_NAMES[cm.getMonth()]} ${cm.getFullYear()}</div>
      <div class="cal-nav-btns">
        <button onclick="changeMonth(-1)" aria-label="Previous month">‹</button>
        <button onclick="changeMonth(1)" aria-label="Next month">›</button>
      </div>
    </div>
    <div class="cal-grid">${dow}${cells}</div>
  `;
}

function renderDayPanel(){
  const d = state.selectedDate;
  const daySlots = slotsForDate(d);
  const isPast = d < today;
  const myId = state.session.user.id;

  let inner = '';
  if(state.slotActionError){
    inner += `<div class="form-error">${escapeHtml(state.slotActionError)}</div>`;
  }
  if(daySlots.length === 0){
    inner += `<p class="past-note">Nothing scheduled this day.</p>`;
  } else {
    if(isPast) inner += `<p class="past-note">This date has passed.</p>`;
    inner += daySlots.map(({slot, role})=>{
      const iso = isoDate(d);
      const instKey = `${slot.id}__${iso}`;
      const filled = signupsFor(slot.id, iso);
      const cap = slot.capacity;
      const isFull = filled.length >= cap;
      const mine = filled.find(e=>e.user_id===myId);
      const capDots = Array.from({length:cap}).map((_,i)=>`<span class="${i<filled.length?'on':''}"></span>`).join('');

      const namesHtml = filled.length ? `<div class="names">${filled.map(e=>{
        const isMine = e.user_id===myId;
        const name = profileName(e.user_id);
        const noteAttr = e.note ? ` title="${escapeAttr(e.note)}"` : '';
        const noteIcon = e.note ? ' <span aria-hidden="true">📝</span>' : '';
        if(!isMine) return `<span class="chip"${noteAttr}>${escapeHtml(name)}${noteIcon}</span>`;
        const ctarget = `signup:${e.id}`;
        if(state.confirmTarget===ctarget){
          return `<span class="chip confirming">${escapeHtml(name)}
            <span class="confirm-inline">Cancel?
              <button class="yes" onclick="removeSignup('${e.id}')">Yes</button>
              <button class="no" onclick="state.confirmTarget=null; render()">No</button>
            </span>
          </span>`;
        }
        return `<span class="chip mine"${noteAttr}>${escapeHtml(name)}${noteIcon}<button title="Cancel" onclick="askRemoveSignup('${ctarget}')">×</button></span>`;
      }).join('')}</div>` : '';

      const withNotes = filled.filter(e=>e.note);
      const notesHtml = withNotes.length ? `<div class="note-list">${withNotes.map(e=>
        `<div class="note-line"><strong>${escapeHtml(profileName(e.user_id))}:</strong> ${escapeHtml(e.note)}</div>`
      ).join('')}</div>` : '';

      let actionHtml = '';
      if(!isPast){
        if(mine){
          const menuKey = `cal:${slot.id}__${iso}`;
          const gcalUrl = buildGoogleCalendarUrl(role, slot, d, mine.note);
          const menuOpen = state.calendarMenuFor === menuKey;
          actionHtml = `
            <div style="margin-top:8px" class="fill-status mine">You're signed up for this.</div>
            <div class="cal-export">
              <button class="small-link" onclick="toggleCalendarMenu('${menuKey}')">Add to calendar ${menuOpen ? '▴' : '▾'}</button>
              ${menuOpen ? `
                <div class="cal-export-menu">
                  <a href="${gcalUrl}" target="_blank" rel="noopener noreferrer">Add to Google Calendar</a>
                  <button onclick="triggerICSDownload('${slot.id}','${iso}')">Download iCal (.ics)</button>
                </div>
              ` : ''}
            </div>`;
        } else if(state.openSignupFor === instKey){
          actionHtml = `
            <div class="inline-form" style="flex-direction:column; align-items:stretch;">
              <input type="text" placeholder="Notes or special requests (optional)" value="${escapeAttr(state.noteDraft)}" oninput="state.noteDraft=this.value" onkeydown="if(event.key==='Enter'){submitSignup('${slot.id}','${iso}',${cap})}">
              <div style="display:flex; gap:8px;">
                <button class="btn" onclick="submitSignup('${slot.id}','${iso}',${cap})">Confirm sign-up</button>
                <button class="btn secondary" onclick="closeSignupForm()">Cancel</button>
              </div>
            </div>`;
        } else {
          actionHtml = `<button class="signup-btn" ${isFull?'disabled':''} onclick="openSignupForm('${instKey}')">${isFull?'Full':'Sign up'}</button>`;
        }
      }

      return `
        <div class="slot-row">
          <div class="slot-top">
            <div class="role-tag"><span class="dot" style="background:${role.color}"></span>${escapeHtml(role.name)}</div>
            <div class="fill-status ${isFull?'full':''}">${isFull ? 'Filled' : `${filled.length} of ${cap} filled`}</div>
          </div>
          <div class="slot-time">${fmtTime(slot.start_time)} – ${fmtTime(slot.end_time)}</div>
          <div class="capacity-dots">${capDots}</div>
          ${namesHtml}
          ${notesHtml}
          ${actionHtml}
        </div>`;
    }).join('');
  }

  return `
    <div class="day-panel">
      <div class="day-panel-heading">${fmtDateLong(d)}</div>
      ${inner}
    </div>
  `;
}

  return d.toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
}

function openAnnouncementForm(){
  state.showAnnouncementForm = true;
  state.newAnnouncementTitle = '';
  state.newAnnouncementBody = '';
  state.announcementFormError = '';

}
function closeAnnouncementForm(){
  state.showAnnouncementForm = false;

async function addAnnouncement(){
  const title = state.newAnnouncementTitle.trim();
  const body = state.newAnnouncementBody.trim();
  state.announcementFormError = '';
  if(!title){ state.announcementFormError = 'Enter a title.'; render(); return; }

    .insert({ title, body, author_id: state.session.user.id })

function startEditAnnouncement(id){
  const a = state.announcements.find(x=>x.id===id);
  if(!a) return;
  state.editingAnnouncementId = id;
  state.editAnnouncementTitle = a.title;
  state.editAnnouncementBody = a.body;
  state.editAnnouncementError = '';
  render();
}
function cancelEditAnnouncement(){
  state.editingAnnouncementId = null;
  state.editAnnouncementError = '';
  render();
}
async function saveEditAnnouncement(id){
  const title = state.editAnnouncementTitle.trim();
  const body = state.editAnnouncementBody.trim();
  state.editAnnouncementError = '';
  if(!title){ state.editAnnouncementError = 'Enter a title.'; render(); return; }
  if(!body){ state.editAnnouncementError = 'Enter some body text.'; render(); return; }
  const { data, error } = await sb.from('announcements')
    .update({ title, body })
    .eq('id', id)
    .select('id, title, body, author_id, created_at')
    .single();
  if(error){ state.editAnnouncementError = error.message; render(); return; }
  const idx = state.announcements.findIndex(x=>x.id===id);
  if(idx>-1) state.announcements[idx] = data;
  state.editingAnnouncementId = null;
  render();
}
async function deleteAnnouncement(id){
  const { error } = await sb.from('announcements').delete().eq('id', id);

  state.announcements = state.announcements.filter(a=>a.id!==id);

}

    .filter(s=>s.user_id===myId && s.signup_date >= todayIso)
    .map(s=>{
      const slot = state.slots.find(x=>x.id===s.slot_id);

          <button class="small-link" onclick="toggleCalendarMenu('${menuKey}')">Add to calendar ${menuOpen ? '▴' : '▾'}</button>
          ${menuOpen ? `
            <div class="cal-export-menu">
              <a href="${gcalUrl}" target="_blank" rel="noopener noreferrer">Add to Google Calendar</a>
              <button onclick="triggerICSDownload('${slot.id}','${signup.signup_date}')">Download iCal (.ics)</button>
            </div>
          ` : ''}
        </div>
        <div style="margin-top:8px">${cancelHtml}</div>
      </div>`;
  }).join('');
}

// ---------- ADMIN ----------

async function saveChurchName(){
  state.churchNameError = '';
  const val = state.newChurchName.trim();
  if(!val) return;
  const { error } = await sb.from('church_settings').update({ church_name: val }).eq('id', true);
  if(error){ state.churchNameError = error.message; render(); return; }
  state.churchName = val;
  state.newChurchName = '';
  render();
}

async function addRole(){
  state.roleFormError = '';
  const name = state.newRoleName.trim();
  if(!name){ state.roleFormError = 'Enter a role name.'; render(); return; }
  const { data, error } = await sb.from('roles').insert({ name, color: state.newRoleColor }).select().single();
  if(error){ state.roleFormError = error.message; render(); return; }
  state.roles.push(data);
  state.roles.sort((a,b)=>a.name.localeCompare(b.name));
  state.newRoleName = '';
  render();
}
async function deleteRole(id){
  const { error } = await sb.from('roles').delete().eq('id', id);
  if(error){ showError(error, 'Could not delete that role.'); state.confirmTarget=null; render(); return; }
  state.roles = state.roles.filter(r=>r.id!==id);
  const removedSlotIds = state.slots.filter(s=>s.role_id===id).map(s=>s.id);
  state.slots = state.slots.filter(s=>s.role_id!==id);
  state.signups = state.signups.filter(s=>!removedSlotIds.includes(s.slot_id));
  state.confirmTarget = null;
  render();
}

async function addSlot(){
  state.slotFormError = '';
  const { roleId, day, start, end, capacity } = state.newSlot;
  if(!roleId){ state.slotFormError = 'Choose a role first.'; render(); return; }
  if(!start || !end){ state.slotFormError = 'Set a start and end time.'; render(); return; }
  if(start >= end){ state.slotFormError = 'End time must be after start time.'; render(); return; }
  if(!capacity || Number(capacity) < 1){ state.slotFormError = 'Volunteers needed must be at least 1.'; render(); return; }
  const { data, error } = await sb.from('slots').insert({
    role_id: roleId, day:Number(day), specific_date:null, start_time:start, end_time:end, capacity:Number(capacity)
  }).select().single();
  if(error){ state.slotFormError = error.message; render(); return; }
  state.slots.push(data);
  render();
}

async function addOneOffSlot(){
  state.oneOffFormError = '';
  const { roleId, date, start, end, capacity } = state.newOneOff;
  if(!roleId){ state.oneOffFormError = 'Choose a role first.'; render(); return; }
  if(!date){ state.oneOffFormError = 'Choose a date.'; render(); return; }
  if(!start || !end){ state.oneOffFormError = 'Set a start and end time.'; render(); return; }
  if(start >= end){ state.oneOffFormError = 'End time must be after start time.'; render(); return; }
  if(!capacity || Number(capacity) < 1){ state.oneOffFormError = 'Volunteers needed must be at least 1.'; render(); return; }
  const { data, error } = await sb.from('slots').insert({
    role_id: roleId, day:null, specific_date:date, start_time:start, end_time:end, capacity:Number(capacity)
  }).select().single();
  if(error){ state.oneOffFormError = error.message; render(); return; }
  state.slots.push(data);
  state.newOneOff = { roleId:'', date:'', start:'09:00', end:'10:00', capacity:3 };
  render();
}

async function deleteSlot(id){
  const { error } = await sb.from('slots').delete().eq('id', id);
  if(error){ showError(error, 'Could not delete that slot.'); state.confirmTarget=null; render(); return; }
  state.slots = state.slots.filter(s=>s.id!==id);
  state.signups = state.signups.filter(s=>s.slot_id!==id);
  state.confirmTarget = null;
  render();
}

async function toggleAdmin(id, current){
  state.userFormError = '';
  const { error } = await sb.from('profiles').update({ is_admin: !current }).eq('id', id);
  if(error){ state.userFormError = error.message; render(); return; }
  const p = profileById(id);
  if(p) p.is_admin = !current;
  if(state.profile && state.profile.id===id) state.profile.is_admin = !current;
  render();
}

function exportRosterCSV(){
  function csvField(s){
    s = String(s === undefined || s === null ? '' : s);
    if(/[",\r\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  }
  const rows = [['Name','Admin']];
  for(const p of state.profiles) rows.push([p.name, p.is_admin ? 'Yes' : '']);
  const csv = rows.map(r=>r.map(csvField).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `volunteer-roster-${isoDate(new Date())}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

// ---------- SHELL / ROUTING ----------

function goAdmin(){
  if(!state.profile || !state.profile.is_admin) return;
  state.view = 'admin';
  state.confirmTarget = null;
  render();
}
function goSignup(){
  state.view = state.session ? 'signup' : 'login';
  state.confirmTarget = null;
  render();
}
function goMySignups(){
  if(!state.session) return;
  state.view = 'my-signups';
  state.confirmTarget = null;
  render();
}

function render(){
  const app = document.getElementById('app');
  document.title = `${state.churchName} — Volunteer Sign-Up`;
  if(!state.loaded){
    app.innerHTML = `<div class="loading">Loading…</div>`;
    return;
  }

  if((state.view==='signup' || state.view==='changepass' || state.view==='my-signups') && !state.session){
    state.view = 'login';
  }
  if(state.view==='admin' && (!state.profile || !state.profile.is_admin)){
    state.view = state.session ? 'signup' : 'login';
  }

  const bareViews = ['login','register','forgot','reset','changepass'];
  const isBare = bareViews.includes(state.view);

  let navHtml = '';
  if(!isBare && state.session && state.profile){
    const tabs = [
      { key:'signup', label:'Schedule', onclick:'goSignup()' },
      { key:'my-signups', label:'My Sign-Ups', onclick:'goMySignups()' }
    ];
    if(state.profile.is_admin) tabs.push({ key:'admin', label:'Admin', onclick:'goAdmin()' });
    tabs.push({ key:'changepass', label:'Change password', onclick:"state.view='changepass'; state.cpError=''; state.cpSuccess=''; render()" });

    const tabsHtml = tabs.map(t=>`<button class="tab ${state.view===t.key?'active':''}" onclick="${t.onclick}">${t.label}</button>`).join('')
      + `<button class="tab signout" onclick="logout()">Sign out</button>`;

    navHtml = `
      <div class="tabbar">
        <span class="whoami">Signed in as ${escapeHtml(state.profile.name)}</span>
        <div class="tabs">${tabsHtml}</div>
      </div>`;
  }

  const headingText = state.view==='admin' ? ['Admin','Manage roles, slots, and volunteers']
    : state.view==='my-signups' ? ['My Sign-Ups','Your upcoming volunteer commitments']
    : [state.churchName, 'Volunteer sign-up'];
  const heading = `<div class="brand-row"><img class="brand-logo" src="${LOGO_DATA_URI}" alt="${escapeAttr(state.churchName)} logo"><div class="titleblock"><h1>${escapeHtml(headingText[0])}</h1><p>${escapeHtml(headingText[1])}</p></div></div>`;

  const errorHtml = state.errorBanner
    ? `<div class="error-banner"><span>${escapeHtml(state.errorBanner)}</span><button onclick="state.errorBanner=null; render()">Dismiss</button></div>`
    : '';

  let body = '';
  if(state.view==='admin') body = renderAdmin();
  else if(state.view==='login') body = renderLogin();
  else if(state.view==='register') body = renderRegister();
  else if(state.view==='forgot') body = renderForgot();
  else if(state.view==='reset') body = renderReset();
  else if(state.view==='changepass') body = renderChangePass();
  else if(state.view==='my-signups' && state.session && state.profile) body = renderMySignups();
  else if(state.session && state.profile) body = renderSignupView();
  else body = state.errorBanner ? '' : `<div class="loading">Loading your profile…</div>`;

  app.innerHTML = `
    <header class="top">
      ${heading}
    </header>
    ${navHtml}
    ${errorHtml}
    ${body}
  `;
}

init();
