<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapel of St. Paul - Coyle Hall</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --accent-color: #2c3e50;
      --button-bg: #2b5278;
      --button-hover: #1e3a56;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-width: 580px;
      width: 100%;
      padding: 45px 35px;
      text-align: center;
      border: 1px solid #e1e8ed;
    }

    .header-title {
      font-size: 1.75rem;
      color: var(--accent-color);
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-subtitle {
      font-size: 1.1rem;
      color: #64748b;
      margin-top: 4px;
      margin-bottom: 25px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .divider {
      height: 2px;
      background-color: #e2e8f0;
      width: 60px;
      margin: 0 auto 25px auto;
    }

    p.message {
      font-size: 1.1rem;
      margin-bottom: 30px;
      color: #334155;
    }

    .btn {
      display: inline-block;
      background-color: var(--button-bg);
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      padding: 13px 28px;
      border-radius: 8px;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 6px rgba(43, 82, 120, 0.15);
    }

    .btn:hover {
      background-color: var(--button-hover);
      transform: translateY(-1px);
    }

    .signoff {
      margin-top: 35px;
      border-top: 1px solid #f1f5f9;
      padding-top: 25px;
      color: #475569;
      font-size: 1rem;
    }

    .signoff .closing {
      margin-bottom: 8px;
    }

    .signoff .name {
      font-weight: 700;
      color: #1e293b;
    }

    .signoff .role {
      font-size: 0.95rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="header-title">Chapel of St. Paul</h1>
    <div class="header-subtitle">Coyle Hall</div>
    
    <div class="divider"></div>

    <p class="message">
      This website has been taken down. Please use the Google Form to denote availability to serve out our liturgies.
    </p>

    <!-- REPLACE YOUR_GOOGLE_FORM_URL_HERE WITH YOUR ACTUAL GOOGLE FORM LINK -->
    <a href="https://forms.gle/QvgEPFyCLiT3no1f7" target="_blank" rel="noopener noreferrer" class="btn">
      Access Google Form
    </a>

    <div class="signoff">
      <div class="closing">Thanks and Peace,</div>
      <div class="name">Matthew Mejia</div>
      <div class="role">Assistant to the Sacristan</div>
    </div>
  </div>

</body>
</html>
